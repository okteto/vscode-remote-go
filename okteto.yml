dev:
  hello-world:
    image: ghcr.io/okteto/golang:1
    autocreate: true
    command: bash
    workdir: /usr/src/app
    sync:
      - .:/usr/src/app
    volumes:
      - /go
      - /root/.cache
      - /root/.vscode-server
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    forward:
      - 8080:8080
      - 2345:2345
